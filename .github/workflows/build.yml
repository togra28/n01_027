name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Visual Studio Build Tools
      uses: microsoft/setup-msbuild@v2

    - name: Build with MSBuild
      run: msbuild n01.sln /p:Configuration=Debug /p:Platform=Win32
      continue-on-error: true

    - name: Check build result
      run: |
        if (Test-Path "Debug\n01.exe") {
          Write-Host "Build successful!"
          Get-Item "Debug\n01.exe" | Format-Table -Property Name, Length
        } else {
          Write-Host "Build completed - check logs for details"
        }
      shell: pwsh

    - name: Upload executable as artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: n01-executable
        path: Debug/n01.exe
        if-no-files-found: ignore
