name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    
    - name: Install dependencies
      run: sudo apt-get update && sudo apt-get install -y build-essential gcc

    - name: Build project
      run: |
        cd ${{ github.workspace }}
        gcc -c *.c -Wall -Wextra -o main.exe main.o
      continue-on-error: true

    - name: Check build result
      run: |
        if [ -f main.exe ]; then
          echo "Build successful!"
          ls -lh main.exe
        else
          echo "Build failed or executable not created"
        fi
